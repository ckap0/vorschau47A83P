<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Villa Solitude – Vorschau</title>
<style>
  :root{--tanne:#17352A;--moos:#24513B;--gold:#C6A15B;--gold-hell:#E8D6A4;--licht:#F1F3EC}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(120% 120% at 20% 0%,var(--moos),var(--tanne) 60%);color:var(--licht);font-family:"Manrope","Segoe UI",Helvetica,Arial,sans-serif}
  .card{width:min(92vw,420px);padding:2.4rem 2rem;border:1px solid rgba(198,161,91,.45);border-radius:18px;background:rgba(23,53,42,.55);backdrop-filter:blur(10px);box-shadow:0 30px 80px -30px rgba(0,0,0,.7)}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:2rem;margin:0 0 .2rem;letter-spacing:.01em}
  .sub{font-size:.78rem;letter-spacing:.12em;color:var(--gold-hell);margin-bottom:1.8rem}
  label{display:block;font-size:.85rem;font-weight:600;margin-bottom:.4rem}
  input{width:100%;font:inherit;font-size:1.05rem;padding:.85rem 1rem;border-radius:10px;border:1px solid rgba(232,214,164,.5);background:rgba(255,255,255,.06);color:var(--licht);outline:none}
  input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(198,161,91,.25)}
  button{margin-top:1rem;width:100%;font:inherit;font-weight:700;padding:.95rem;border-radius:999px;border:0;background:var(--gold);color:var(--tanne);cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  .err{color:#F3C7A6;font-size:.9rem;margin-top:.8rem;min-height:1.2em}
  .foot{font-size:.75rem;color:rgba(232,214,164,.7);margin-top:1.6rem}
</style>
</head>
